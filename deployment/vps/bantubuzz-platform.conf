<VirtualHost *:80>
    ServerName bantubuzz.com
    ServerAlias www.bantubuzz.com

    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName bantubuzz.com
    ServerAlias www.bantubuzz.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/bantubuzz.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/bantubuzz.com/privkey.pem

    ProxyPreserveHost On
    ProxyTimeout 120

    # Flask API and Socket.IO retain their existing public paths.
    ProxyPass /api http://127.0.0.1:8002/api
    ProxyPassReverse /api http://127.0.0.1:8002/api
    ProxyPass /socket.io http://127.0.0.1:3002/socket.io
    ProxyPassReverse /socket.io http://127.0.0.1:3002/socket.io
    ProxyPass /messaging/api http://127.0.0.1:3002/api
    ProxyPassReverse /messaging/api http://127.0.0.1:3002/api

    # CMS browser API namespace. This must appear before the public page rules.
    ProxyPass /content-api http://127.0.0.1:3010/content-api
    ProxyPassReverse /content-api http://127.0.0.1:3010/content-api

    # Next.js assets and editorial media used by SSR content pages.
    ProxyPass /_next http://127.0.0.1:3010/_next
    ProxyPassReverse /_next http://127.0.0.1:3010/_next
    ProxyPass /media http://127.0.0.1:3010/media
    ProxyPassReverse /media http://127.0.0.1:3010/media

    # Public editorial authority paths rendered by the headless CMS.
    ProxyPass /blog http://127.0.0.1:3010/blog
    ProxyPassReverse /blog http://127.0.0.1:3010/blog
    ProxyPass /research http://127.0.0.1:3010/research
    ProxyPassReverse /research http://127.0.0.1:3010/research
    ProxyPass /authors http://127.0.0.1:3010/authors
    ProxyPassReverse /authors http://127.0.0.1:3010/authors
    ProxyPass /categories http://127.0.0.1:3010/categories
    ProxyPassReverse /categories http://127.0.0.1:3010/categories
    ProxyPass /tags http://127.0.0.1:3010/tags
    ProxyPassReverse /tags http://127.0.0.1:3010/tags
    ProxyPass /hubs http://127.0.0.1:3010/hubs
    ProxyPassReverse /hubs http://127.0.0.1:3010/hubs
    ProxyPass /entities http://127.0.0.1:3010/entities
    ProxyPassReverse /entities http://127.0.0.1:3010/entities
    ProxyPass /glossary http://127.0.0.1:3010/glossary
    ProxyPassReverse /glossary http://127.0.0.1:3010/glossary
    ProxyPass /newsletter http://127.0.0.1:3010/newsletter
    ProxyPassReverse /newsletter http://127.0.0.1:3010/newsletter
    ProxyPass /developers http://127.0.0.1:3010/developers
    ProxyPassReverse /developers http://127.0.0.1:3010/developers
    ProxyPass /rss http://127.0.0.1:3010/rss
    ProxyPassReverse /rss http://127.0.0.1:3010/rss
    ProxyPass /feed.json http://127.0.0.1:3010/feed.json
    ProxyPassReverse /feed.json http://127.0.0.1:3010/feed.json
    ProxyPass /sitemap.xml http://127.0.0.1:3010/sitemap.xml
    ProxyPassReverse /sitemap.xml http://127.0.0.1:3010/sitemap.xml
    ProxyPass /robots.txt http://127.0.0.1:3010/robots.txt
    ProxyPassReverse /robots.txt http://127.0.0.1:3010/robots.txt
    ProxyPass /llms.txt http://127.0.0.1:3010/llms.txt
    ProxyPassReverse /llms.txt http://127.0.0.1:3010/llms.txt

    Alias /uploads /var/www/bantubuzz/backend/uploads
    <Directory /var/www/bantubuzz/backend/uploads>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    DocumentRoot /var/www/bantubuzz/frontend
    <Directory /var/www/bantubuzz/frontend>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/bantubuzz-error.log
    CustomLog ${APACHE_LOG_DIR}/bantubuzz-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName app.bantubuzz.com
    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName app.bantubuzz.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/app.bantubuzz.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/app.bantubuzz.com/privkey.pem

    ProxyPreserveHost On
    ProxyTimeout 120
    ProxyPass / http://127.0.0.1:3010/
    ProxyPassReverse / http://127.0.0.1:3010/

    ErrorLog ${APACHE_LOG_DIR}/bantubuzz-cms-error.log
    CustomLog ${APACHE_LOG_DIR}/bantubuzz-cms-access.log combined
</VirtualHost>
